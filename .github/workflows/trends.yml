name: Monthly trends page

# On the 1st of each month, regenerate trends/index.html from the previous
# month's anonymous usage (Supabase trends_summary(), see scripts/trends.sql)
# and commit it to main; Netlify deploys the commit. Run it by hand from the
# Actions tab to rebuild now, optionally for a given month (YYYY-MM).
# Scheduled runs only fire from the default branch.

on:
  schedule:
    - cron: "0 7 1 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Month to report (YYYY-MM). Blank = previous month."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate trends page
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          MONTH: ${{ github.event.inputs.month }}
        run: node scripts/build-trends.js $MONTH
      - name: Commit if changed
        run: |
          if git diff --quiet -- trends/index.html; then
            echo "No change to the trends page."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trends/index.html
          git commit -m "Update monthly trends page"
          git push
