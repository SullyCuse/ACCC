name: Supabase keep-alive

# Supabase free tier auto-pauses a project after 7 days of no activity.
# This pings the REST API on a schedule so the project stays active.
# Runs Mon/Wed/Fri (max gap ~3 days, leaving margin even if a run is skipped).
# A non-200 response fails the job, which emails the repo owner — so a broken
# ping can't go unnoticed until the project is already paused.

on:
  schedule:
    - cron: "0 8 * * 1,3,5"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping component_specs
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/component_specs?select=name&limit=1")
          echo "HTTP $status"
          if [ "$status" != "200" ]; then
            echo "Keep-alive ping failed (expected 200)."
            exit 1
          fi
          echo "Supabase keep-alive ping succeeded."
